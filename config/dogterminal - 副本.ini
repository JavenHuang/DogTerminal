; ============================================================
; 机器狗终端配置（每只狗一份，多终端部署时复制本文件修改）
; 用法: ./dogterminal --config config/dogterminal.ini
; ============================================================

[Terminal]
; 终端ID（唯一，>0），用于MQ路由键: state.{Id} / heartbeat.{Id} / feedback.{Id} / cmd.{Id}
Id=1

[RabbitMq]
; 服务器RabbitMQ地址
; 本机联调: 127.0.0.1；实机部署: 改为实际服务器IP
Host=192.168.0.176
Port=5672
Vhost=/
User=simplatform
Password=simplatform
; Topic交换机名（与服务器一致）
Exchange=kdiss.dog
; 断线重试周期ms
RetryMs=5000

[Report]
; 状态上报频率Hz（1~100）
StateRateHz=10
; 终端心跳周期（秒）
HeartbeatSec=1
; 执行任务时服务器消息超时判定（秒，需服务器周期发下行心跳）
ServerLinkTimeoutSec=5
; 速度直控死手保护（ms，超时无新指令自动零速）
VelocityTimeoutMs=500

[Dog]
; 南向驱动: udp    = 自实现 UDP+JSON（跨平台，默认）
;           sdk    = 官方 libzsibot（仅 Linux 构建，Windows 会自动回退为 udp）
;           matrix = MATRiX 仿真（Zenoh+UDP 组合，仅 Linux 构建）
Driver=matrix
; 机器狗IP（每狗独立子网，见配置确认记录）
; matrix 模式下填 MATRiX 运行主机 IP（本机填 127.0.0.1）
Ip=127.0.0.1
; 控制口：udp/sdk=8081，matrix=7447
SendPort=7447
; 状态口：udp/sdk=8080，matrix=7447（Zenoh 监听 TCP 端口）
RecvPort=7447
; SDK角色: sdk / remote
Role=sdk
; 心跳周期ms（协议默认50）
HeartbeatMs=50
; 断连判定ms（协议默认5000）
TimeoutMs=5000
; 连接后自动申请SDK控制权并进入移动模式
AutoAcquireControl=true
; 本地控制台状态打印频率Hz（真狗联调观察姿态/方向用，0=关闭）
PrintStateHz=1

; ------------------------------------------------------------
; MATRiX 仿真专属配置（仅 Driver=matrix 时生效）
; 默认值来自 MATRiX v1.1.2 config_default.json
; ------------------------------------------------------------
[Matrix]
; Zenoh 端点：tcp/<ip>:<port>，本机 UeSim 默认 tcp/127.0.0.1:7447
ZenohEndpoint=tcp/127.0.0.1:7447
; Zenoh 模式：client（连 MATRiX）/ router（自己当路由节点）
ZenohMode=client
; 话题前缀（MATRiX 默认 "rt"）
TopicPrefix=rt
; IMU 话题（config_default.json 里 "/imu"）
ImuTopic=/imu
; Odom 话题（config_default.json 里 "topic": "/odom"，Zenoh 实际发布 rt/odom）
OdomTopic=/odom

[Nav]
; ============================================================
; 速度策略：
;   0 = Cruise 匀速巡航，vDes 直接硬切 maxSpeed，起步猛冲、收油无物理约束急刹
;   1 = Profile 三段式，起步加速度过渡 → 匀速巡航 → 收油减速度约束减速（推荐）
; 【强制】两种模式都启用收油衰减（StopArriveRadiusMul），否则快速巡航
; 到终点狗冲过目标后目标方向反向、大转向 180°、站不稳
SpeedMode=1
; ------------------------------------------------------------
; 导航控制参数（弧度由度数换算）
; 转向对准容差（度）
HeadingToleranceDeg=5
; 直行中重新对准阈值（度）
ReAlignThresholdDeg=15
; 转向P增益
KpAlign=1.5
; 直行航向保持增益
KpHoldYaw=1.0
; 距离→期望速度增益（1/s）（当前未使用，保留）
KpDist=0.6
; 速度闭环P增益（必须 < 1，否则离散闭环振荡）
KpVel=0.5
; 最大转向角速度 rad/s
MaxTurnRate=1.2
; 最大线速度 m/s（终端上限，服务器下发值会被截断）
; MATRiX 的 walk 在 joystick=1.0 时约 2.0 m/s，取 2.0 可用满量程
MaxLinearSpeed=2.0
; joystick=1.0 对应线速度 m/s
; MATRiX 实测：forward=0.3 时 odom vx≈0.61 m/s，故约 2.0
JoyLinearScale=2.0
; joystick=1.0 对应角速度 rad/s
JoyTurnScale=1.5
; 允许目标在侧后方时倒退接近
AllowBackward=true
; 对准阶段最小前进速度 m/s（MATRiX 下 walk 需 forward≠0 才会转向，设 0 则原地转向）
AlignCreepSpeed=0.25
; MATRiX/UE 摇杆轴死区补偿（实测 |axis|<0.2 的输入被丢弃，小量指令完全无效）
MinAxisOut=0.22
; 收油段：到达半径的多少倍内开始线性减速（两种模式都强制启用）
; MATRiX 下 2 m/s 巡航时，1.5m 到达半径 × 6.0 = 9m 开始收油
; 收油速率：Cruise 模式无物理约束（vDes 直接按距离硬切），Profile 模式受 MaxDecel 约束
StopArriveRadiusMul=6.0
; 收油段衰减到的最小速度 m/s（低于此值不再继续降，避免到终点完全不动）
MinCreepSpeed=0.25
; 服务器未下发 arriveRadius 时的默认到达半径 m
ArriveRadiusDefault=1.5
; Profile 模式专用：起步加速度上限（m/s²）
; Cruise 模式忽略。值越小起步越平滑，1.0 = 2s 从 0 加速到 2 m/s
MaxAccel=1.0
; Profile 模式专用：收油减速度上限（m/s²）
; Cruise 模式忽略。2.0 = 1s 从 2 m/s 减速到 0，比加速快一倍更快停稳
MaxDecel=2.0

[Convert]
; MATRiX(UE) 场景的 y 轴与 TRUGC 战术地图的 y 轴方向相反时置 true
; （实测：对齐 x 后 y 相反、对齐 y 后 x 相反，属镜像坐标系）
; 开启后 世界 y = originY - 局部 y，偏航角同步取反
FlipY=true
