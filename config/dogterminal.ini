; ============================================================
; 机器狗终端配置（每只狗一份，多终端部署时复制本文件修改）
; 用法: ./dogterminal --config config/dogterminal.ini
; ============================================================

[Terminal]
; 终端ID（唯一，>0），用于MQ路由键: state.{Id} / heartbeat.{Id} / feedback.{Id} / cmd.{Id}
; 另派生 detection.{Id}（[Detection] RoutingKey 留空时）与 calib.{Id}（标定面板）；
; 日志文件名里的 %id% 也用它。同一台机器上跑多个终端时，本项必须各不相同
Id=1
; 日志落盘：空=只输出控制台；相对路径按程序目录解析。现场调试建议开启，
; 事后可与服务器日志按时间戳对齐（文件内每行带 时间 [级别] 正文）
; %id% 会替换成 [Terminal] Id：多终端共用同一部署目录时各自写自己的文件，
; 不会互相覆盖、也不会在滚动时删掉对方的日志。需要固定文件名就删掉 %id%。
LogFile=log/dogterminal_%id%.log
; 单个日志文件上限MB（0=不滚动），超过后滚成 .1/.2/...
LogMaxMB=20
; 滚动保留份数
LogKeep=3
; 输出级别：debug|info|warn|error|off（写入 .log 文件的级别）
; debug 会带出导航/NavDbg 等细节；稳定运行时可调成 info
LogLevel=debug
; 控制台(stderr)级别：debug|info|warn|error|off，与 LogLevel 相互独立
; 默认 warn：终端只显示告警/错误，1Hz 状态行与每帧差分行只写 .log——
; 现场排查时按时间戳翻日志即可，不再被刷屏。要看全部就改成 debug。
LogConsole=warn

[RabbitMq]
; 服务器RabbitMQ地址
; 本机联调: 127.0.0.1 192.168.8.150；实机部署: 改为实际服务器IP
Host=192.168.8.151
Port=5672
Vhost=/
User=simplatform
Password=simplatform
; Topic交换机名（与服务器一致）
Exchange=kdiss.dog
; 断线重试周期ms
RetryMs=5000

[Report]
; 状态上报频率Hz（1~100）
StateRateHz=10
; 终端心跳周期（秒）
HeartbeatSec=1
; 执行任务时服务器消息超时判定（秒，需服务器周期发下行心跳）
; 实测服务器下行心跳间隔 >5s，用 5s 会在每次下发 move 后 5.3~5.8s 取消任务
ServerLinkTimeoutSec=15
; 速度直控死手保护（ms，超时无新指令自动零速）
VelocityTimeoutMs=500

[Dog]
; 南向驱动: udp    = 自实现 UDP+JSON（跨平台，默认）
;           sdk    = 官方 libzsibot（仅 Linux 构建，Windows 会自动回退为 udp）
;           matrix = MATRiX 仿真（Zenoh+UDP 组合，仅 Linux 构建）
Driver=udp
; 机器狗IP（每狗独立子网，见配置确认记录）
; matrix 模式下填 MATRiX 运行主机 IP（本机填 127.0.0.1）
Ip=192.168.168.168
; 控制口：udp/sdk=8081，matrix=7447
SendPort=8081
; 状态口：udp/sdk=8080，matrix=7447（Zenoh 监听 TCP 端口）
RecvPort=8080
; SDK角色: sdk / remote（作用于下发指令的 JSON role 字段）
Role=sdk
; 心跳角色：留空=沿用 Role（推荐，身份统一为 sdk）
; 【现场实测结论】设为 remote 时，20Hz 心跳与遥控帧的 sdk 身份互抢控制权，
; 狗在 sdk/remote 之间反复切模式：表现为"走两步就停"、状态包成片丢失
; （09:38~09:41 日志中共 11 处 ≥3s 空洞）。此处置空，身份与 Role=sdk 保持一致。
HeartbeatRole=
; 心跳周期ms（协议默认50）
HeartbeatMs=50
; 断连判定ms（协议默认5000）
TimeoutMs=5000
; 连接后自动申请SDK控制权并进入移动模式
; false 时终端启动不主动申请，由服务端下发 control <id>（姿态命令 10=申请控制权）触发
AutoAcquireControl=false
; 启动时申请控制权后的重试次数：0=只申请一次，之后不再周期重复申请
AcquireRetryCount=1
; 控制权申请重试周期ms（仅在 AcquireRetryCount>0 时生效）
AcquireRetryMs=500
; 链路自愈：状态包停推（狗端 SDK 会话失效）后每隔该 ms 自动重发一次"申请SDK控制权"
; 【为什么需要】狗端只向"会话持有者"推送状态包。遥控器接管、狗端看门狗重置、
; 或狗重启后，终端的会话被淘汰 → 状态流停 3~5s → 终端判"断开"，而且此时
; isConnected()=false 会让所有重试分支直接返回，终端自己永远救不回来，
; 只有人工操作遥控器把狗端会话表重置一次才恢复。
; 0=关闭（需要长时间用遥控器手操时设 0，避免自动抢控制权）
AutoRecoverMs=3000
; 自愈最多尝试次数：0=不限；到上限后静默，仍可用服务端 control <id> 人工重试
AutoRecoverMax=20
; 本地控制台状态打印频率Hz（真狗联调观察姿态/方向用，0=关闭）
PrintStateHz=1

; ------------------------------------------------------------
; 地图坐标（局部坐标 ↔ 本地地图坐标）
; 地图约定：+x 正东，+y 正南；朝向角 0=正东、顺时针为正（0~360）
;           0=东 90=南 180=西 270=北；北=(0,-y) 南=(0,+y) 东=(+x,0) 西=(-x,0)
; 参考基准（与狗开机时刻无关）：
;   1) 狗先开机、可以先被遥控移动到摆放点
;   2) 终端启动后收到的首个有效位姿 = 地图 (0,0) 点、狗体朝向 = 0°(正东)
;   3) 运行中可随时通过 MC_RESET(mapreset / GUI"设为原点")重建参考
;   4) 精确校准：遥控走已知直线后由服务端下发 mapline 终点坐标，
;      终端拟合尺度与残余朝向
; Enabled=true 时状态上报与下发任务均使用地图坐标（calibrated=true）；
; 未建立参考或 Enabled=false 时保持原始局部坐标（calibrated=false）。
; ------------------------------------------------------------
[Map]
Enabled=true
; 参考点对应的地图坐标 m（摆放点即 (0,0) 时保持 0,0）
OriginX=0
OriginY=0
; 终端启动后首个有效位姿是否自动建立参考
AutoReference=true
; 里程计跳变补偿：狗端 odom 坐标系整体重置（遥控器接管、模式切换、重定位）时，
; 原始局部位置会瞬间平移数米，导致地图 (0,0) 点漂移。开启后自动把跳变增量
; 平移到参考点，地图输出保持连续（狗未真实移动则地图位置不变）。
; 注意：该补偿会让"遥控接管后的真实移动"在地图上看不到，默认关闭；
;       确认 odom 重置已由狗端修复后可再打开。
JumpCompensate=false
; 狗端局部 yaw 基准整体跳变的补偿（断链/控制权重置后 yaw 常常一次跳 30~70°，
; 位置却几乎不动）。开启后参考朝向跟着同步平移，地图航向保持连续，
; 旋转任务不会被"跳变后的错朝向"骗成到位。默认 true。
YawJumpCompensate=true
; 直线标定尺度门限：拟合出的 地图位移/局部位移 必须落在 [ScaleMin, ScaleMax]
ScaleMin=0.7
ScaleMax=1.3
; 直线标定允许的最大残余朝向误差（度）：在精确档内同时修正朝向与尺度
MaxHeadingErrDeg=15
; 粗标定上限（度）：残余角在此区间内只修正参考朝向、尺度保持 1；超出则拒绝
CoarseHeadingErrDeg=40
; 直线标定要求的最小局部位移 m（太短的线段方向噪声大）
MinLineDist=1.0

; ------------------------------------------------------------
; 位姿质量（yaw 稳定化）
; 狗端 IMU 存在 0.2~0.4°/s 的静止漂移，且 odom/IMU 基准可能在
; 遥控接管、模式切换时整体重置。本段用于抑制这两类问题。
; ------------------------------------------------------------
[Pose]
; yaw 稳定化总开关（跳变抑制 + 静止锁；零偏仅用于诊断打印，不再从增量中扣除）
YawStabilize=false
; 静止多少秒后冻结朝向（0=不冻结）；静止判定：无导航/速度直控，且 |vBody|<0.02、
; |gyro_z|<0.05 rad/s。冻结只在静止时生效，开始运动/转向会立即自动解锁。
StaticLockSec=0
; 单帧 yaw 跳变判定阈值（度）：与陀螺积分比对超差即视为基准异常
YawJumpDeg=15
; 单帧最大有效间隔（秒）。狗端状态包常见 1Hz，间隔过小会把整段真实转动丢弃；
; 超过该值才按断线处理并重锚（建议 3，且必须大于实际状态包周期）
MaxFrameGapSec=3
; 位移方向辅助航向校验（推荐开启）：用"直线前进时的里程计位移方向"作为独立观测，
; 与 IMU 航向比对；偏差大或航向可疑时直接按位移方向重建基准。
DispHdgAssist=true
; 有效直线位移窗口长度（米）：太短方向噪声大，建议 0.8~1.5
DispHdgMinDist=0.8
; 进入窗口的最小速度（米/秒）
DispHdgMinSpeed=0.12
; 轻度修正门限（度）：偏差超过该值但未到重建门限时，按 20% 渐进修正（抑制打滑/漂移）
DispHdgCorrectDeg=15
; 重建门限（度）：偏差超过该值（或航向已被标记可疑）时，直接采用位移方向重建航向
DispHdgReanchorDeg=45

; ------------------------------------------------------------
; MATRiX 仿真专属配置（仅 Driver=matrix 时生效）
; 默认值来自 MATRiX v1.1.2 config_default.json
; ------------------------------------------------------------
[Matrix]
; Zenoh 端点：tcp/<ip>:<port>，本机 UeSim 默认 tcp/127.0.0.1:7447
ZenohEndpoint=tcp/10.105.94.164:7447
; Zenoh 模式：client（连 MATRiX）/ router（自己当路由节点）
ZenohMode=client
; 话题前缀（MATRiX 默认 "rt"）
TopicPrefix=rt
; IMU 话题（config_default.json 里 "/imu"）
ImuTopic=/imu
; Odom 话题（config_default.json 里 "topic": "/odom"，Zenoh 实际发布 rt/odom）
OdomTopic=/odom

[Nav]
; ------------------------------------------------------------
; 控制节拍（本轮修复"走两步就停 / 一卡一卡"的核心开关）
; 旧实现：导航推进与遥控下发都只挂在"状态包到达"事件上，控制刷新率
; 等于状态包到达率（名义 1Hz，空洞时 3~4s 一拍），狗每拍收到一帧摇杆量
; 后随即断流 → 走走停停。现在由独立定时器按 CtrlTickMs 用最近一次状态
; 连续推进导航并续发遥控量，控制节拍与状态包完全解耦。
CtrlTickMs=50
; 状态包中断超过该值(ms)则暂停导航盲发并零速（0=不限制，始终续发上一拍）
; 取 3000 与位姿最大有效间隔（Pose/MaxFrameGapSec）一致
CtrlStaleStopMs=3000
; ============================================================
; 速度策略：
;   0 = Cruise 匀速巡航，vDes 直接硬切 maxSpeed，起步猛冲、收油无物理约束急刹
;   1 = Profile 三段式，起步加速度过渡 → 匀速巡航 → 收油减速度约束减速（推荐）
; 【强制】两种模式都启用收油衰减（StopArriveRadiusMul），否则快速巡航
; 到终点狗冲过目标后目标方向反向、大转向 180°、站不稳
SpeedMode=1
; ------------------------------------------------------------
; 导航控制参数（弧度由度数换算）
; 转向对准容差（度）
; 真狗撤舵后仍有 30~40° 停转惯性，10° 容差必然过冲反号来回摆，放大到 20°
HeadingToleranceDeg=20
; 直行中重新对准阈值（度），必须 > 上面的容差以形成滞环
ReAlignThresholdDeg=30
; 转向P增益
KpAlign=1.5
; 导航诊断日志（[NvDbg] / [NvRot]，5Hz）：排除问题时才置 true
DebugLog=false
; 转向D增益：用陀螺 yawRate 做阻尼（输出 = Kp*err - Kd*yawRate）
; 0 表示关闭D项；过大（>1.0）在转向响应滞后下可能引发高频抖动
KdAlign=0.4
; 接近对准容差的"减速带"（度）：|航向误差| 小于此值后限制转向角速度
AlignSlowBandDeg=25
; 减速带内的转向角速度上限 rad/s（远低于 MaxTurnRate，让惯性收敛在容差内）
; 0.4 → 0.3：单拍过冲从约 69° 压到更可收敛的范围（配合 20Hz 控制节拍）
AlignSlowMaxTurnRate=0.3
; 直行航向保持增益
KpHoldYaw=1.0
; 距离→期望速度增益（1/s）（当前未使用，保留）
KpDist=0.6
; 速度闭环P增益（必须 < 1，否则离散闭环振荡）
KpVel=0.5
; 最大转向角速度 rad/s
; 1.2 → 0.8：旧值在 1Hz 控制下每拍可下达 69° 转向，极易过冲后反号来回摆
MaxTurnRate=0.8
; 最大线速度 m/s（终端上限，服务器下发值会被截断）
; MATRiX 的 walk 在 joystick=1.0 时约 2.0 m/s，取 2.0 可用满量程
MaxLinearSpeed=2.0
; joystick=1.0 对应线速度 m/s
; 真狗实测（axis1 前后轴单独标定）：|joystick| 0.5 → |vx| 0.45~0.56 m/s，
; |joystick| 1.0 → 0.91~1.16 m/s，即增益约 1.0 m/s 每单位
; （MATRiX 实测 forward=0.3 → vx≈0.61，对应 2.0，仿真场景请改为 2.0）
JoyLinearScale=1.0
; joystick=1.0 对应角速度 rad/s
; 真狗实测（axis2 旋转轴）：|joystick| 0.5 → gyro_z 0.52~0.59 rad/s，
; 折合增益约 1.1 rad/s 每单位（原 1.5 会导致转向偏慢、到对准点超调）
JoyTurnScale=1.1
; 禁止倒退（默认）：目标在侧后方时先转向对准再前进，不允许倒车接近
; true=允许目标在正后方时直接倒车接近（腿足原地转向打滑，一般保持 false）
AllowBackward=false
; 对准阶段最小前进速度 m/s（MATRiX 下 walk 需 forward≠0 才会转向）
; PurePursuit 兜底转向（目标在正后方且 AllowBackward=false）时也用这个值
AlignCreepSpeed=0.25
; MATRiX/UE 摇杆轴死区补偿（实测 |axis|<0.2 的输入被丢弃，小量指令完全无效）
MinAxisOut=0
; 收油段：到达半径的多少倍内开始线性减速（两种模式都强制启用）
; MATRiX 下 2 m/s 巡航时，1.5m 到达半径 × 6.0 = 9m 开始收油
; 收油速率：Cruise 模式无物理约束（vDes 直接按距离硬切），Profile 模式受 MaxDecel 约束
StopArriveRadiusMul=4.0
; 收油段衰减到的最小速度 m/s（低于此值不再继续降，避免到终点完全不动）
MinCreepSpeed=0.25
; 服务器未下发 arriveRadius 时的默认到达半径 m（= 硬到达，进入即停车）
; 注意：服务器下发的值小于此值时会被抬到此值（见 MainController::handleMoveCmd）
ArriveRadiusDefault=0.2
; 软到达半径倍数：dist ≤ mul × arriveRadius 时先发一次 MR_ARRIVED feedback
; 但不停车，让服务器有机会无缝下发下一个航点；真走到 ArriveRadiusDefault
; 以内则硬到达停车。设 1.0 表示关闭软到达。
SoftArriveRadiusMul=2.0
; Profile 模式专用：起步加速度上限（m/s²）
; Cruise 模式忽略。值越小起步越平滑，1.0 = 2s 从 0 加速到 2 m/s
MaxAccel=1.0
; Profile 模式专用：收油减速度上限（m/s²）
; Cruise 模式忽略。2.0 = 1s 从 2 m/s 减速到 0，比加速快一倍更快停稳
MaxDecel=2.0

; ------------------------------------------------------------
; 转向律选择（腿足平台关键项）
;   1 = PurePursuit（推荐）：不停车、边走边转、连续曲率跟踪，
;       从根上消除"原地转向"这个最大打滑源
;   0 = AlignThenGo（旧行为）：先原地对准再直行，仅用于回归对比
; PurePursuit 下 HeadingToleranceDeg / ReAlignThresholdDeg / KpAlign / KdAlign
; 只影响"目标在正后方且禁止倒车"那一小段兜底转向。
SteeringMode=1
; 前视距离下限 m：必须大于 ArriveRadiusDefault，否则接近目标时曲率病态打摆
PpLookaheadMin=0.5
; 前视距离上限 m：越大越平顺但切弯越晚
PpLookaheadMax=1.2
; 前视距离 = K × 巡航速度（秒）：速度越快看得越远
PpLookaheadK=0.4

; ------------------------------------------------------------
; 速度闭环摇杆增益自适应
; SetRemote 传的是归一化量，真实"1.0 摇杆 = 多少 m/s"会随地面材质、
; 电量、档位变化（地毯上可能只有水泥地的一半）。开启后用实测 bodyVx
; 反算真实增益并慢速跟随，替代固定的 JoyLinearScale。
JoyGainAdaptEnable=true
; 自适应下限/上限 m/s per joy（防止异常值把增益带飞）
JoyGainMin=0.3
JoyGainMax=3.0
; 一阶低通系数：0.02 很稳但收敛慢，0.10 快但易被单帧打滑带偏
JoyGainTau=0.05

; ------------------------------------------------------------
; 差分(RTK)绝对位姿（服务端经 MQ 路由键下发，约 200ms 一帧）
; 两阶段用途：先"接收 → 换算 → 比对 → 打印"，再"融合 → 供导航与上报"。
; 坐标与角度口径（与服务端约定，终端不再二次换算）：
;   位置 x=东、y=南（北为 -y），单位 m；z 为高程，只记录不参与平面导航。
;   航向单位 度，正东=0、顺时针 0~360（90=南、180=西、270=北）。
[Rtk]
; 【2026-11-14 现场决定】差分整体关闭：位姿与朝向全部由狗体里程计提供。
; 现场流程：狗摆到 00 点朝东 → 启动终端（自动建参考=地图原点、0°正东）
;          → 向前走 2m → 服务端下发 mapline 1 2 0 拟合尺度与朝向。
; Enabled=false 时终端不绑定 la 路由键、不解析任何差分帧、不建标定面板，
; 下方所有 Rtk/* 项（标定门槛、零位、同步、融合）一概不生效。
Enabled=false
; 差分定位的 MQ 路由键（与指令同交换机、同队列，按路由键分流）
RoutingKey=la
; 本机差分 ID（整数）。同一 la 主题下有多台设备时必须填，否则会收到别的狗的数据
; 0=不校验（只有一台时可用）
DiffId=0
; 超过该值无新帧即判为断流并告警 ms（实测服务端约 200~560ms 一帧、偶有 1s 停顿，
; 取 1500 才不会把正常抖动报成断流；程序还会按实测平均周期自动放宽到 3 个周期）
StaleMs=1500
; 单帧合理性门限：200ms 内位移超过该值或航向超过该角度的帧直接丢弃
MaxJumpM=1.5
MaxJumpDeg=30
; 天线相位中心相对狗体中心的前向/左向偏置 m（前为正、左为正）
; 不补偿会让绝对位置系统性偏出一个固定量，比对时表现为恒定 Δ位置
AntennaOffsetX=0
AntennaOffsetY=0
; 天线基线方向与狗体纵轴的固定夹角 度（装反/装偏时用它一次性修正）
YawOffsetDeg=0

; ---- 融合位姿源与在线标定（第二阶段）----
; 融合位姿（差分锚点 + 里程计增量）是否接管导航与上报
; false = 回到第一阶段"只观测"，导航/上报仍用纯里程计
UseForPose=false
; 是否在线自动解"差分→地图"的尺度 k 与转角 α（首次行走后自动完成）
AutoCalib=false
; 解算门槛：最少"静止锚点"个数、最少里程 m、允许的最大残差 RMS
; 差分只有约 5Hz（实测 500~560ms 一帧），收到时给的是 0.2~0.5s 前的位姿，
; 运动中拿它配当前里程计，0.5m/s 就是 0.25m 的形状误差，会把 k 与 α 解偏。
; 所以标定只在"停稳"时采点：走一段、停 2s、再走一段、再停……采 4 个不同位置的点
; 即可解出 k 与 α（同一位置反复停不算新点，点位间距由 CalibPointGapM 控制）。
CalibMinPoints=4
CalibMinPathM=0.8
CalibMaxRmsM=0.12
; 停稳判定：持续静止多久算一个锚点 ms；两个锚点的最小间距 m
CalibStaticHoldMs=1500
CalibPointGapM=0.35
; 融合偏移的一阶低通时间常数 s（兼容旧键，实际由下面静止/慢速两档控制）
OffsetTauSec=0.5
; 差分断流后仍用"冻结偏移 + 里程计外推"的时长 ms，超时即告警
HoldMs=2000
; 是否采信差分航向做绝对朝向。true=位置与朝向都锚到差分；
; false=只用差分位置锚定，朝向走"里程计 + 位置标定出的转角"
; 判据：看 [Rtk] 日志里的"航向范围"，若长期恒为 0~0.5° 而狗实际在转，说明服务端没算航向，置 false
YawFromRtk=false

; ---- 静止门控（规避差分低频/滞后）----
; 核心策略：里程计 20Hz 负责"增量与时间连续"，差分负责"绝对锚点"。
; 只有狗确实不动（且不在原地大角度转）时，差分才被采信去更新偏移；
; 运动中偏移直接冻结，位姿由里程计推进 —— 这样 500ms 的滞后不会被固化进地图。
; 低于该速度视为静止，可快速重锚 m/s（默认 0.03，即 3cm/s）
OffStaticSpeed=0.03
; 低于该速度允许慢速微调 m/s（默认 0.2；介于静止与慢速之间用 OffSlowTauSec 慢慢跟）
OffSlowSpeed=0.2
; 角速度低于该值才允许微调航向 度/s（默认 5；原地转圈时不校朝向，避免把滞后角固化）
OffSlowYawRateDeg=5
; 静止时偏移低通时间常数 s（默认 0.3，约 2 帧收敛到差分真值）
OffStaticTauSec=0.3
; 慢速时偏移低通时间常数 s（默认 2.0，抗抖动但跟得慢）
OffSlowTauSec=2.0

; ---- 差分航向零位 b（会话量，不进 mapcalib/rtkcalib）----
; 差分航向每次上电的零位是随机的（转向增量准确）。建地图参考的那一姿态就是
; 地图 0°（正东），所以 b = 那一姿态下的差分原值 yaw，归一化 yaw = yaw - b。
; 服务端已归零时 b≈0（扣了等于没扣），未归零时 b 就是随机角（扣掉正好），
; 不存在"服务端扣一次、终端再扣一次"的双扣。b 只存内存，每次建参考重取。
; 是否在建参考后自动取零位
ZeroAuto=false
; 静止持续多久才开始取（ms）：太短会把抖动写进基准
ZeroHoldMs=800
; 取多少帧做圆周均值（5Hz 时 3 帧≈0.6s，配合 ZeroHoldMs 共约 1.4s）
ZeroMinFrames=3

; ---- 停点标定的合理性判据（越界不采用，避免错值持久化）----
; k 只解"残差尺度"，主尺仍是 mapcalib 的 Scale，所以正常应≈1；
; α 正常应≈0（地图 0° 已由 mapreset 对齐）。
; 越界说明前面 mapcalib 的 Scale/refYaw 有问题：先重做一次 3~5m 的 mapcheck/mapline，
; 不要重复跑停点标定。
CalibKMin=0.95
CalibKMax=1.05
CalibAlphaMaxDeg=5

; ---- 直线反算零位（把 b 归到"地图东"，建参考时不必摆正朝东）----
; 停点 A→B 的差分位移方向就是狗在服务端地图里的真实行进方向，差分给自己的航向
; 读数与它之差就是 b（含天线安装角，合并成一个量即可）。与 k/α 标定解耦，
; 所以 k/α 已标定、不再采样的场次照样生效。仅在 YawFromRtk=true 且 ZeroAuto=true 时才生效。
; 是否启用（默认 true）
ZeroFromLine=false
; 单段最小位移 m（默认 0.6；太短则角度噪声被放大，0.6m 上 3cm 噪声≈2.9°）
ZeroLineSegM=0.6
; 累计直线长度门槛 m（默认 2.5）：走停 3 次、每段约 1m 即达标
ZeroLineMinM=2.5
; 各段反算出的 b 之间允许的最大散布 度（默认 2.0）：超了就丢弃重观测
; 常见原因：中途纠偏、走成折线、差分模块重启、服务端 yaw 恒定
ZeroLineSpreadDeg=2

; ---- 航向一致性监视（α 松动告警）----
; 差分航向与里程计地图航向的常值偏差，正确标定后应长期贴近 0。
; 判据用 4s 低通值（不看累计均值，避免历史把重新标定后的正常状态拖高）。
; 持续超过该阈值就告警，提示先查天线安装角 α 有没有松动/被撞偏，再重做标定。
; 0 = 关闭告警（只打印，不点名）
YawBiasWarnDeg=3.0

; ============================================================
; 目标检测（YOLO26 检测结果 UDP → RabbitMQ 转发）
;
; 链路：188 检测服务（192.168.8.188:8097）→ UDP → 本机 :5006
;       → 本终端按 (来源地址, message_id) 归组重组（base64-json-utf8，
;         每包 ≤1200B、每片 ≤600B、3s 不完整整帧丢弃）
;       → 校验 robotdog.detection 后原样转发到 MQ 路由键 detection.<Id>
;
; 只读通道：不改写报文、不参与位姿/导航/任务；MQ 断开时丢弃并计数，
;          不影响 state / heartbeat / feedback / la 任何现有链路。
; 188 网页里"UDP结果发送"要填本机 IP（填 127.0.0.1 会发给 188 自己）
; 与本端口；接收端必须先监听，否则数据直接丢。
; ============================================================
; 以下为独立段：代码读 Detection/Enabled 等键，缺段头时这些键会被算进 [Rtk]
[Detection]
; 是否开启（代码默认 false：缺这一段就不监听端口）
Enabled=true
; 监听地址；0.0.0.0 = 所有网卡
Bind=0.0.0.0
; 监听端口，必须与 188 网页里"UDP结果发送"的接收端口一致
; 若本机还手动跑着 解析脚本.py --port 5006，先停掉它或把这里改成 5007
; 同一台机器上跑多个终端时，各终端的本端口必须错开（相邻终端差 1~2），
; 否则后启动的那个 bind 失败，检测通道不工作（其余功能不受影响）
Port=5006
; 转发路由键；留空 = detection.<Terminal/Id>
RoutingKey=
; 转发限流 Hz（0=不限）。188 推理上限 10FPS，留 10 即与上游一一对应
MaxHz=10
; detections 为空的帧是否跳过（true=只转有目标的帧，省带宽与 MQ 流量）
SkipEmpty=true
; 每帧打印一行（默认 false，只每 5s 打一条统计，避免刷屏）
VerboseLog=false


